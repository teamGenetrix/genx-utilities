<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--gx-font);background:#fff;color:var(--gx-noir);padding:20px}.mono{font-family:var(--gx-font-mono);font-size:11px}</style>
</head><body><div style="display:flex;gap:12px"><div style="flex:1;min-width:120px"><div style="height:64px;background:#1A7A3C;border:1px solid var(--gx-line);border-radius:10px"></div><div style="margin-top:8px;font-weight:600;font-size:12px">success</div><div class="mono" style="color:var(--gx-gris)">#1A7A3C</div></div><div style="flex:1;min-width:120px"><div style="height:64px;background:#E7F6EC;border:1px solid var(--gx-line);border-radius:10px"></div><div style="margin-top:8px;font-weight:600;font-size:12px">success-bg</div><div class="mono" style="color:var(--gx-gris)">#E7F6EC</div></div><div style="flex:1;min-width:120px"><div style="height:64px;background:#9A6A10;border:1px solid var(--gx-line);border-radius:10px"></div><div style="margin-top:8px;font-weight:600;font-size:12px">warning</div><div class="mono" style="color:var(--gx-gris)">#9A6A10</div></div><div style="flex:1;min-width:120px"><div style="height:64px;background:#FDF3E3;border:1px solid var(--gx-line);border-radius:10px"></div><div style="margin-top:8px;font-weight:600;font-size:12px">warning-bg</div><div class="mono" style="color:var(--gx-gris)">#FDF3E3</div></div><div style="flex:1;min-width:120px"><div style="height:64px;background:#B80000;border:1px solid var(--gx-line);border-radius:10px"></div><div style="margin-top:8px;font-weight:600;font-size:12px">danger</div><div class="mono" style="color:var(--gx-gris)">#B80000</div></div><div style="flex:1;min-width:120px"><div style="height:64px;background:#FBE6E6;border:1px solid var(--gx-line);border-radius:10px"></div><div style="margin-top:8px;font-weight:600;font-size:12px">danger-bg</div><div class="mono" style="color:var(--gx-gris)">#FBE6E6</div></div></div></body></html>
