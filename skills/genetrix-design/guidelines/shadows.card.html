<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--gx-font);background:#fff;color:var(--gx-noir);padding:20px}.mono{font-family:var(--gx-font-mono);font-size:11px}body{background:#fafafa}</style>
</head><body><div style="display:flex;gap:24px;flex-wrap:wrap;padding:8px 0 4px"><div style="text-align:center"><div style="width:130px;height:76px;background:#fff;border-radius:12px;box-shadow:var(--gx-shadow-sm)"></div><div style="font-weight:600;font-size:12px;margin-top:12px">shadow-sm</div><div style="color:var(--gx-gris);font-size:11px">Controls, chips</div></div><div style="text-align:center"><div style="width:130px;height:76px;background:#fff;border-radius:12px;box-shadow:var(--gx-shadow-md)"></div><div style="font-weight:600;font-size:12px;margin-top:12px">shadow-md</div><div style="color:var(--gx-gris);font-size:11px">Hovered cards</div></div><div style="text-align:center"><div style="width:130px;height:76px;background:#fff;border-radius:12px;box-shadow:var(--gx-shadow-lg)"></div><div style="font-weight:600;font-size:12px;margin-top:12px">shadow-lg</div><div style="color:var(--gx-gris);font-size:11px">Raised surfaces</div></div><div style="text-align:center"><div style="width:130px;height:76px;background:#fff;border-radius:12px;box-shadow:var(--gx-shadow-xl)"></div><div style="font-weight:600;font-size:12px;margin-top:12px">shadow-xl</div><div style="color:var(--gx-gris);font-size:11px">Dark cards, mocks</div></div></div></body></html>
