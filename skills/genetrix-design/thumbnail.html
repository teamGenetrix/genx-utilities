<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./styles.css" />
<style>
  html,body{margin:0}
  .tile{width:1280px;height:854px;display:flex;overflow:hidden}
  .main{flex:1;background:var(--gx-noir);display:flex;align-items:center;justify-content:center;padding:0 90px}
  .main img{width:78%;max-width:720px;height:auto}
  .strip{width:300px;display:flex;flex-direction:column}
  .strip div{flex:1}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><img src="./assets/logo-wordmark-blanc.png" alt="Genetrix" /></div>
  <div class="strip">
    <div style="background:#E36A6A"></div>
    <div style="background:#D00000"></div>
    <div style="background:#9A0000"></div>
  </div>
</div>
</body>
</html>
