<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--gx-font);background:#fff;padding:24px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}.ico svg{width:16px;height:16px}.ico18 svg{width:18px;height:18px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Eyebrow } = window.GenetrixDesignSystem_ba57d8;
function Ic({ n, big }) { return <i className={big ? 'ico18' : 'ico'} data-lucide={n} style={{ display: 'inline-flex' }} />; }
function Demo() {
  React.useEffect(() => { lucide.createIcons(); });
  return (
    <div>
      <Eyebrow number="01" style={{ marginBottom: 16 }}>L'idée directrice</Eyebrow>
      <div className="row">
        <Button variant="primary">Prendre rendez-vous</Button>
        <Button variant="dark">Nous contacter</Button>
        <Button variant="outline">En savoir plus</Button>
        <Button variant="ghost">Annuler</Button>
      </div>
      <div className="row">
        <Button size="sm">Petit</Button>
        <Button size="md">Moyen</Button>
        <Button size="lg" iconRight={<Ic n="arrow-right" />}>Grand</Button>
        <Button variant="primary" disabled>Désactivé</Button>
      </div>
      <div className="row">
        <IconButton variant="dark" aria-label="Menu"><Ic n="menu" big /></IconButton>
        <IconButton variant="outline" aria-label="Recherche"><Ic n="search" big /></IconButton>
        <IconButton variant="ghost" aria-label="Fermer"><Ic n="x" big /></IconButton>
        <IconButton variant="primary" aria-label="Suivant"><Ic n="arrow-right" big /></IconButton>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
